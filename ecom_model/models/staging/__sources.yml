sources:
  - name: raw 
    database: raw 
    schema: e_commerce
    tables:
      - name: customer
        columns:
          - name: customer_id 
            tests: 
              - not_null
              - unique

      - name: product 
        columns:
          - name: product_code
            tests:
              - not_null
              - unique

      - name: region 
        columns:
          - name: region_code
            tests:
              - not_null
              - unique

      - name: ecom_sales
        columns:
          - name: row_id
            tests:
              - not_null
              - unique